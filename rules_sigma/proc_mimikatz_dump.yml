title: Dump Cirúrgico de LSASS por MiniDump
id: b3a72d3f-561b-4190-8bbf-85f524458f21
status: production
description: Detecta a extração de credenciais de memória utilizando utilitários legítimos do sistema ou procdump.
author: Sentinela Sovereign Threat Research
date: 2026-09-03
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_comsvcs:
    CommandLine|contains:
      - comsvcs.dll
      - minidump
  selection_procdump:
    CommandLine|contains:
      - procdump
      - lsass
  condition: 1 of selection*
level: critical
