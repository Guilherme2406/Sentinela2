title: Destruição Ativa de Cópias de Sombra (Anti-Ransomware)
id: c4e83f12-782a-4a21-9c88-12e3456789ab
status: production
description: Detecta deleção forçada de Shadow Copies (VSS) frequentemente realizada por ransomwares antes de criptografar arquivos.
author: Sentinela Sovereign Threat Research
date: 2026-09-03
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vss:
    CommandLine|contains:
      - vssadmin
      - delete
      - shadows
  selection_wmic:
    CommandLine|contains:
      - wmic
      - shadowcopy
      - delete
  condition: 1 of selection*
level: critical
